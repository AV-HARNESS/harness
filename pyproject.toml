[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "harness"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "fastapi",
    "uvicorn",
    "google-auth",
    "google-auth-oauthlib",
    "python-dotenv",
]

[tool.setuptools.packages.find]
where = ["src"]
